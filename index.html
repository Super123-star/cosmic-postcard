<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Космическая открытка</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff;
      font-family: system-ui, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #5332a8 0, transparent 30%),
        radial-gradient(circle at 80% 80%, #133a75 0, transparent 35%),
        #090b1c;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 15% 25%, white 50%, transparent),
        radial-gradient(1px 1px at 70% 18%, white 50%, transparent),
        radial-gradient(2px 2px at 85% 65%, white 50%, transparent),
        radial-gradient(1px 1px at 35% 80%, white 50%, transparent),
        radial-gradient(1px 1px at 55% 45%, white 50%, transparent);
      background-size: 250px 250px;
      animation: drift 18s linear infinite;
    }

    @keyframes drift {
      to { transform: translateY(-100px); }
    }

    main {
      position: relative;
      width: min(90%, 560px);
      padding: 42px 28px;
      text-align: center;
      border: 1px solid #ffffff30;
      border-radius: 28px;
      background: #ffffff12;
      box-shadow: 0 20px 80px #0008;
      backdrop-filter: blur(12px);
    }

    .planet { font-size: 64px; }

    h1 {
      margin: 12px 0;
      font-size: clamp(30px, 7vw, 48px);
    }

    p {
      color: #d8d9f5;
      line-height: 1.6;
    }

    #message {
      min-height: 58px;
      margin: 24px 0;
      font-size: 20px;
      color: #fff;
    }

    button {
      padding: 14px 22px;
      border: 0;
      border-radius: 14px;
      color: #17112c;
      background: linear-gradient(135deg, #ffdc81, #ff9ed2);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s, filter .2s;
    }

    button:hover {
      transform: translateY(-3px);
      filter: brightness(1.08);
    }

    .signature {
      margin-top: 24px;
      font-size: 13px;
      opacity: .7;
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <main>
    <div class="planet">🪐</div>
    <h1>Привет!</h1>
    <p>Каждой галактике иногда нужно доброе послание.</p>

    <div id="message">Нажми на кнопку — и получи своё ✨</div>

    <button id="button">Получить послание 🚀</button>

    <div class="signature">Сделано на Земле, с космической любовью</div>
  </main>

  <script>
    const messages = [
      "Ты способен на большее, чем думаешь 🌟",
      "Даже маленький шаг — это уже движение к цели 🚀",
      "Сегодня отличный день, чтобы придумать что-то классное ✨",
      "В твоей галактике главная звезда — ты ☀️",
      "Ошибки — это просто секретные уровни обучения 🎮",
      "Твоя идея может изменить целую вселенную 💫"
    ];

    document.querySelector("#button").addEventListener("click", () => {
      const randomMessage =
        messages[Math.floor(Math.random() * messages.length)];

      document.querySelector("#message").textContent = randomMessage;
    });
  </script>
</body>
</html>
